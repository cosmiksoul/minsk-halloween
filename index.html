<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Скелеты Минска · Хеллоуин</title>
<meta name="description" content="Пиксельный центр Минска, по которому гуляют, пьют пиво и танцуют случайные скелеты.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="bubbles"></div>

<div id="panel">
  <div class="title">СКЕЛЕТЫ МИНСКА <span class="muted">· ночь на 1 ноября</span><button id="bFold" title="свернуть">–</button></div>
  <div class="body">
    <div class="stats"><b id="stPop">0</b> скелетов · <b id="stMeet">0</b> встреч · <b id="stBeer">0</b> пива · <b id="stDance">0</b> танцев</div>
    <label>население <input type="range" id="pop" min="20" max="800" step="10" value="400"><span id="popV">400</span></label>
    <label>скорость <input type="range" id="spd" min="0.5" max="6" step="0.5" value="1.5"><span id="spdV">1,5×</span></label>
    <label>пиксель <input type="range" id="pix" min="1" max="5" step="1" value="2"><span id="pixV">2</span></label>
    <div class="btns">
      <button id="bRot" title="повернуть камеру">⟲ поворот</button>
      <button id="bRand">случайный скелет</button>
      <button id="bParty">🎃 вечеринка</button>
      <button id="bReset">сброс</button>
    </div>
    <div class="hint">перетаскивай · колесо — зум · правая кнопка — поворот · клик по скелету — кто это</div>
  </div>
</div>

<div id="card" hidden>
  <canvas id="cardPic" width="96" height="144"></canvas>
  <div class="cardBody">
    <div class="name" id="cName"></div>
    <div class="line" id="cMeta"></div>
    <div class="line" id="cJob"></div>
    <div class="line muted" id="cStatus"></div>
    <div class="line muted" id="cState"></div>
    <div class="cardBtns"><button id="bFollow">следить</button><button id="bClose">закрыть</button></div>
  </div>
</div>

<div id="loading"><div class="skull">💀</div><div>собираем кости…</div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
